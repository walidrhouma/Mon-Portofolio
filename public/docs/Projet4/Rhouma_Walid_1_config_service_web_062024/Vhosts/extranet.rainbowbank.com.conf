<VirtualHost 150.10.0.10:80>
	
	ServerName extranet.rainbowbank.com
	ServerAlias www.extranet.rainbowbank.com
	ServerAdmin admin@rainbowbank.com
	DocumentRoot /var/www/extranet.rainbowbank.com

	# Redirection vers HTTPS
	Redirect permanent / https://extranet.rainbowbank.com/
	
	
	# Fichiers de log Vhost extranet
	ErrorLog ${APACHE_LOG_DIR}/extranet_error.log
	CustomLog ${APACHE_LOG_DIR}/extranet_access.log combined
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	
</VirtualHost>

<VirtualHost 150.10.0.10:443>
        ServerAdmin admin@rainbowbank.com
        ServerName extranet.rainbowbank.com
        DocumentRoot /var/www/extranet.rainbowbank.com
	
	
        <Directory /var/www/extranet.rainbowbank.com>
                
		Options -Indexes -FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>

	<Directory /var/www/extranet.rainbowbank.com/pdf>
		
		Options +Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
		

	ErrorLog ${APACHE_LOG_DIR}/extranet_https_error.log
        CustomLog ${APACHE_LOG_DIR}/extranet_https_access.log combined	

        SSLEngine on
        SSLCertificateFile    /etc/ssl/certificat.crt
        SSLCertificateKeyFile /etc/ssl/certificat.key

</VirtualHost>
