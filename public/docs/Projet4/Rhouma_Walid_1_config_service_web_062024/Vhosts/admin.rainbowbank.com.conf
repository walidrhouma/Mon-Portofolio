<VirtualHost 192.168.0.20:5501>

        ServerName admin.rainbowbank.com
        ServerAdmin admin@rainbowbank.com
	DocumentRoot /var/www/admin.rainbowbank.com

	# Redircetion vers HTTPS
        Redirect permanent / https://admin.rainbowbank.com:5502/
	

        ErrorLog ${APACHE_LOG_DIR}/admin_error.log
        CustomLog ${APACHE_LOG_DIR}/admin_access.log combined
	CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>

<VirtualHost 192.168.0.20:5502>

        ServerName admin.rainbowbank.com
        ServerAdmin admin@rainbowbank.com
        DocumentRoot /var/www/admin.rainbowbank.com

	ErrorLog ${APACHE_LOG_DIR}/admin_https_error.log
        CustomLog ${APACHE_LOG_DIR}/admin_https_access.log combined	

        SSLEngine on
        SSLCertificateFile    /etc/ssl/certificat.crt
        SSLCertificateKeyFile /etc/ssl/certificat.key

       
 
        <Directory /var/www/admin.rainbowbank.com>
        Options -Indexes -FollowSymLinks
        AllowOverride All
        Require all granted
        </Directory>

</VirtualHost>
