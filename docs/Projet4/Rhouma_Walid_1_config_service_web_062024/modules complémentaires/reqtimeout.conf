<IfModule reqtimeout_module>
    # Réduire le temps d'attente pour les en-têtes à 5 secondes avec un taux minimum de 500 octets par seconde
    RequestReadTimeout header=5-10,MinRate=500

    # Réduire le temps d'attente pour le corps de la requête à 5 secondes avec un taux minimum de 500 octets par seconde
    RequestReadTimeout body=5,MinRate=500
</IfModule>




